<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>motionScripts — transcripts</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #fff;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, monospace;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #000; border-bottom: 1px solid #fff;
    padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
  header .count { border: 1px solid #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; }
  header input {
    flex: 1; min-width: 180px; background: #000; color: #fff;
    border: 1px solid #fff; border-radius: 6px; padding: 8px 10px; outline: none;
  }
  header input::placeholder { color: #888; }
  header button, header a.btn {
    background: #fff; color: #000; border: 1px solid #fff; border-radius: 6px;
    padding: 8px 12px; cursor: pointer; font-weight: 700; text-decoration: none; font-size: 13px;
  }
  header button.secondary, header a.btn.secondary { background: #000; color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { border: 1px solid #fff; border-radius: 10px; padding: 14px; background: #000; }
  .card h2 { font-size: 13px; margin: 0 0 8px; word-break: break-all; font-weight: 400; }
  .card h2 a { color: #fff; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pill { border: 1px solid #888; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: #ddd; }
  audio { width: 100%; margin: 8px 0; filter: grayscale(1) contrast(1.2); }
  .full { white-space: pre-wrap; border: 1px dashed #888; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .row button { background: #000; color: #fff; border: 1px solid #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .row button.solid { background: #fff; color: #000; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { border-bottom: 1px solid #444; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { border-bottom: 1px solid #fff; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; color: #bbb; }
  td.t { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.t button { background: none; border: none; color: #fff; text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }
  .empty { border: 1px solid #555; border-radius: 10px; padding: 40px 20px; text-align: center; color: #aaa; }
  footer { text-align: center; color: #777; font-size: 12px; padding: 24px; }
  .status { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<header>
  <h1>Transcripts</h1>
  <span class="count" id="count">0</span>
  <input id="q" type="search" placeholder="filter by text or url…" />
  <span class="status" id="status">live</span>
  <button id="reload" class="secondary">Reload</button>
  <a class="btn secondary" href="transcripts.json" target="_blank" rel="noopener">JSON</a>
</header>
<main id="list"></main>
<footer>black &amp; white viewer · auto-refreshes every 2s · serves ./transcripts.json</footer>
<script>
const list = document.getElementById('list');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const statusEl = document.getElementById('status');
let data = [];

function fmt(s) {
  s = Number(s) || 0;
  const m = Math.floor(s / 60), sec = (s % 60);
  return m + ':' + sec.toFixed(1).padStart(4, '0');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const items = [...data].reverse().filter(e => {
    if (!q) return true;
    return ((e.url||'') + ' ' + (e.full_text||'')).toLowerCase().includes(q);
  });
  countEl.textContent = data.length;
  if (!items.length) {
    list.innerHTML = '<div class="empty">No transcripts yet.<br/>Run main.py and paste a link.</div>';
    return;
  }
  list.innerHTML = items.map((e, ri) => {
    const i = data.length - 1 - ri;
    const segs = (e.segments || []).map(s => `
      <tr>
        <td class="t"><button data-audio="${i}" data-t="${s.start}">${fmt(s.start)}</button> → ${fmt(s.end)}</td>
        <td>${esc(s.text)}</td>
      </tr>`).join('');
    return `
    <article class="card">
      <h2><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a></h2>
      <div class="meta">
        <span class="pill">#${i}</span>
        <span class="pill">${esc(e.model || '')}</span>
        <span class="pill">${esc(e.language || '?')} ${(e.language_probability ?? '')}</span>
        <span class="pill">${e.duration ?? '?'}s</span>
        <span class="pill">${esc(e.transcribed_at || '')}</span>
      </div>
      ${e.audio_file ? `<audio id="audio-${i}" controls preload="none" src="${esc(e.audio_file)}"></audio>` : ''}
      <div class="row">
        <button class="solid" onclick="copyText(${i})">Copy text</button>
        <button onclick="toggleSegs(${i})">Segments (${(e.segments||[]).length})</button>
      </div>
      <div class="full" id="full-${i}">${esc(e.full_text || '')}</div>
      <div id="segs-${i}" style="display:none;overflow-x:auto">
        <table><thead><tr><th>Time</th><th>Text</th></tr></thead><tbody>${segs}</tbody></table>
      </div>
    </article>`;
  }).join('');
}

async function load() {
  try {
    statusEl.textContent = 'live • updating…';
    const res = await fetch('transcripts.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    if (!Array.isArray(data)) data = [];
    render();
    statusEl.textContent = 'live • ' + new Date().toLocaleTimeString();
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
  }
}

function copyText(i) {
  const idx = (typeof i === 'number') ? i : 0;
  const e = data[idx];
  if (!e) return;
  navigator.clipboard.writeText(e.full_text || '').then(() => {
    statusEl.textContent = 'copied #' + idx;
  });
}
function toggleSegs(i) {
  const el = document.getElementById('segs-' + i);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-audio]');
  if (!b) return;
  const a = document.getElementById('audio-' + b.dataset.audio);
  if (a) { a.currentTime = parseFloat(b.dataset.t) || 0; a.play(); }
});
document.getElementById('reload').onclick = load;
qEl.oninput = render;
load();
setInterval(load, 2000);
</script>
</body>
</html>
