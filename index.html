<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>motion — link to transcript</title>
<style>
  :root { font: 100%/1.5 system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: #111; font-size: 0.9375rem; line-height: 1.6; }
  /* Sticky translucent chrome — content scrolls under */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }
  .bar-inner { max-width: 680px; margin: 0 auto; padding: 14px 20px 12px; }
  .bar h1 { font-size: 1.375rem; line-height: 1.1; letter-spacing: -0.02em; margin: 0; font-weight: 700; font-optical-sizing: auto; }
  .bar .sub { color: #666; font-size: 0.8125rem; margin-top: 2px; }
  /* soft scroll-edge fade instead of a hard divider */
  .bar::after { content: ""; display: block; height: 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05), transparent); opacity: 0; transition: opacity 200ms ease; }
  .bar.scrolled::after { opacity: 1; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 20px 80px; }

  form.add { display: flex; gap: 8px; }
  form.add input { flex: 1; border: 1px solid #ddd; border-radius: 12px; padding: 12px 14px; font-size: 1rem; outline: none; background: #fff; color: #111; min-width: 0; }
  form.add input:focus { border-color: #111; }
  /* instant press feedback */
  button { -webkit-tap-highlight-color: transparent; }
  .btn { border: 1px solid #111; background: #111; color: #fff; border-radius: 12px; padding: 12px 18px; font-size: 0.875rem; font-weight: 600; cursor: pointer;
    transition: transform 100ms ease-out; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; }
  .btn-ghost { background: #fff; color: #111; border: 1px solid #ddd; border-radius: 999px; padding: 8px 16px; font-size: 0.8125rem; font-weight: 600; cursor: pointer;
    transition: transform 100ms ease-out, border-color 150ms ease; }
  .btn-ghost:active { transform: scale(0.97); border-color: #111; }
  .btn-ghost.ok { border-color: #111; }
  .hint { font-size: 0.75rem; color: #999; margin: 8px 2px 0; }

  .section { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 28px 0 10px; }
  .job, .card { border: 1px solid #e9e9e9; border-radius: 18px; padding: 16px; margin-bottom: 12px; background: #fff; }
  /* entering cards materialize — blur+rise together, from presentation value, interruptible */
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.995); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .card.enter { animation: rise 350ms ease-out; }
  .url { font-size: 0.8125rem; word-break: break-all; color: #111; text-decoration: none; }
  a.url:hover { text-decoration: underline; }
  .msg { font-size: 0.8125rem; color: #777; margin-top: 4px; }
  .msg.err { color: #111; }
  .meta { font-size: 0.75rem; color: #999; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .text { white-space: pre-wrap; font-size: 0.9375rem; line-height: 1.65; margin-top: 10px; }

  /* ---- custom player (replaces native audio) ---- */
  .player { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; touch-action: none; }
  .play { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; border: 1px solid #111; background: #111; color: #fff;
    display: grid; place-items: center; cursor: pointer; transition: transform 100ms ease-out; }
  .play:active { transform: scale(0.94); }
  .play svg { width: 16px; height: 16px; display: block; }
  .play .icon-pause { display: none; }
  .player.playing .play .icon-play { display: none; }
  .player.playing .play .icon-pause { display: block; }
  .track { flex: 1; height: 28px; display: flex; align-items: center; cursor: pointer; position: relative; }
  .rail { position: relative; height: 4px; width: 100%; border-radius: 999px; background: #ececec; overflow: hidden; }
  .fill { position: absolute; inset: 0; background: #111; border-radius: 999px; transform-origin: left center; transform: scaleX(0); will-change: transform; }
  .knob { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #111; transform: translate(-50%,-50%) scale(0.6);
    transition: transform 150ms ease-out; pointer-events: none; }
  .track:hover .knob, .track.scrubbing .knob { transform: translate(-50%,-50%) scale(1); }
  .time { font-size: 0.75rem; color: #777; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 86px; text-align: right; }

  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  /* segments disclosure — symmetric path, mirrored easing, interruptible */
  .segs-toggle { background: none; border: none; padding: 6px 0; font-size: 0.8125rem; color: #666; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .segs-toggle .chev { display: inline-block; transition: transform 250ms cubic-bezier(0.32,0.72,0,1); font-size: 0.7rem; }
  .segs-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .segs { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 250ms cubic-bezier(0.32,0.72,0,1), opacity 200ms ease; }
  .segs.open { grid-template-rows: 1fr; opacity: 1; }
  .segs > div { overflow: hidden; }
  .seg { display: flex; gap: 10px; padding: 9px 2px; border-top: 1px solid #f1f1f1; align-items: baseline; }
  .seg:first-child { border-top: none; }
  .seg button { flex: 0 0 auto; background: #f4f4f4; border: 1px solid transparent; border-radius: 999px; padding: 3px 10px; font-size: 0.75rem;
    font-variant-numeric: tabular-nums; cursor: pointer; color: #111; transition: transform 100ms ease-out, background 150ms ease; }
  .seg button:active { transform: scale(0.95); }
  .seg button.live { background: #111; color: #fff; }
  .seg p { margin: 0; font-size: 0.875rem; line-height: 1.55; }
  .toolbar input { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 10px 12px; font-size: 0.875rem; outline: none; }
  .toolbar input:focus { border-color: #111; }
  .empty { text-align: center; color: #aaa; font-size: 0.875rem; padding: 40px 0; }

  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f5; }
    .bar { background: rgba(0,0,0,0.6); border-bottom-color: rgba(255,255,255,0.25); }
    .bar .sub { color: #aaa; }
    form.add input, .toolbar input { background: #000; color: #f5f5f5; border-color: #333; }
    .job, .card { background: #000; border-color: #2a2a2a; }
    .url { color: #fff; }
    .meta, .msg { color: #aaa; }
    .rail { background: #2a2a2a; }
    .fill, .knob, .play { background: #f5f5f5; }
    .play { border-color: #f5f5f5; color: #000; }
    .btn-ghost { background: #000; color: #fff; border-color: #444; }
    .seg { border-color: #1e1e1e; }
    .seg button { background: #1e1e1e; color: #fff; }
    .seg button.live { background: #f5f5f5; color: #000; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .bar { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .card.enter { animation: none; }
    .segs { transition: opacity 200ms ease; }
  }
  @media (prefers-contrast: more) {
    .job, .card, form.add input, .toolbar input { border-color: currentColor; }
  }
</style>
</head>
<body>
<header class="bar" id="bar"><div class="bar-inner">
  <h1>motion</h1>
  <div class="sub">Paste a link → mp3 → transcript.</div>
</div></header>

<div class="wrap">
  <form class="add" id="form">
    <input id="url" type="url" placeholder="https://instagram.com/… or x.com/…" required autocomplete="off" />
    <button class="btn" id="go" type="submit">Transcribe</button>
  </form>
  <div class="hint">yt-dlp -t mp3 · faster-whisper · saved to transcripts.json</div>

  <div class="section">Queue</div>
  <div id="jobs"></div>

  <div class="section">Transcripts <span id="count"></span></div>
  <div class="toolbar"><input id="q" type="search" placeholder="Search…" /></div>
  <div id="list"></div>
</div>

<script>
const form = document.getElementById('form');
const urlEl = document.getElementById('url');
const goEl = document.getElementById('go');
const jobsEl = document.getElementById('jobs');
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');
const bar = document.getElementById('bar');
let jobs = [], data = [], lastSig = '';
const players = new Map(); // idx -> {audio, els...} persists across polls so playback never resets
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

addEventListener('scroll', () => bar.classList.toggle('scrolled', scrollY > 4), { passive: true });

form.onsubmit = async (e) => {
  e.preventDefault();
  const url = urlEl.value.trim();
  if (!url) return;
  goEl.disabled = true;
  try {
    const r = await fetch('/api/add', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ url }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    urlEl.value = '';
    await refresh();
  } catch (err) { alert(err.message); }
  finally { goEl.disabled = false; }
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Number(s)||0; const m = Math.floor(s/60); return m + ':' + (s%60).toFixed(1).padStart(4,'0'); };
const rubberband = (o, dim, c=0.55) => (o * dim * c) / (dim + c * Math.abs(o)); // soft edges, never a hard stop

function renderJobs(){
  jobsEl.innerHTML = jobs.length ? jobs.map(j => `
    <div class="job">
      <a class="url" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.url)}</a>
      <div class="msg ${j.status==='error'?'err':''}">${esc(j.status)} — ${esc(j.message||'')}</div>
    </div>`).join('') : '<div class="msg">Nothing queued.</div>';
}

function sig(d){ return d.length + '|' + d.map(e => e.url + (e.transcribed_at||'')).join(';'); }

function renderList(){
  const q = qEl.value.trim().toLowerCase();
  const order = [...data.keys()].reverse().filter(i => !q || ((data[i].url||'')+' '+(data[i].full_text||'')).toLowerCase().includes(q));
  countEl.textContent = data.length ? `· ${data.length}` : '';
  const s = sig(data) + '|' + q;
  if (s === lastSig) return; // don't clobber live players on every poll
  lastSig = s;
  if (!order.length) { listEl.innerHTML = '<div class="empty">No transcripts yet.</div>'; players.clear(); return; }
  const seen = new Set(order);
  for (const k of [...players.keys()]) if (!seen.has(k)) { players.get(k).audio.pause(); players.delete(k); }
  listEl.innerHTML = order.map(i => {
    const e = data[i];
    const segs = (e.segments||[]).map(s2 => `
      <div class="seg" data-start="${s2.start}">
        <button data-seek="${i}:${s2.start}" aria-label="Play from ${fmt(s2.start)}">${fmt(s2.start)}</button>
        <p>${esc(s2.text)}</p>
      </div>`).join('');
    const isNew = !players.has(i);
    return `<article class="card ${isNew && !reducedMotion ? 'enter' : ''}" data-card="${i}">
      <a class="url" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a>
      <div class="meta">${esc(e.language||'?')} · ${e.duration??'?'}s · ${esc(e.model||'')} · ${esc((e.transcribed_at||'').slice(0,16).replace('T',' '))}</div>
      ${e.audio_file ? `
      <div class="player" data-player="${i}">
        <audio preload="metadata" src="/${esc(e.audio_file)}"></audio>
        <button class="play" data-play="${i}" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>
          <svg class="icon-pause" viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2.5h3.4v11H3.5zM9.1 2.5h3.4v11H9.1z"/></svg>
        </button>
        <div class="track" data-track="${i}" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" tabindex="0">
          <div class="rail"><div class="fill" data-fill="${i}"></div></div>
          <div class="knob" data-knob="${i}"></div>
        </div>
        <div class="time" data-time="${i}">0:00.0 / 0:00.0</div>
      </div>` : ''}
      <div class="text">${esc(e.full_text||'')}</div>
      <div class="row"><button class="btn-ghost" data-copy="${i}">Copy</button></div>
      <button class="segs-toggle" data-toggle="${i}" aria-expanded="false"><span class="chev">▶</span> Segments (${(e.segments||[]).length})</button>
      <div class="segs" data-segs="${i}"><div>${segs}</div></div>
    </article>`;
  }).join('');
  wirePlayers();
}

function wirePlayers(){
  document.querySelectorAll('[data-player]').forEach(root => {
    const i = +root.dataset.player;
    if (players.has(i)) return;
    const audio = root.querySelector('audio');
    const st = { audio, root, fill: root.querySelector('[data-fill]'), knob: root.querySelector('[data-knob]'),
      time: root.querySelector('[data-time]'), track: root.querySelector('[data-track]'),
      scrubbing: false, hist: [] };
    players.set(i, st);
    audio.preload = 'metadata';
    audio.addEventListener('timeupdate', () => paint(st));
    audio.addEventListener('loadedmetadata', () => paint(st));
    audio.addEventListener('play', () => root.classList.add('playing'));
    audio.addEventListener('pause', () => root.classList.remove('playing'));
    const track = st.track;
    track.addEventListener('pointerdown', e => {
      track.setPointerCapture(e.pointerId); // stay glued even off-bounds
      st.scrubbing = true; track.classList.add('scrubbing');
      st.hist = [{ x: e.clientX, t: performance.now() }];
      seekFromEvent(st, e);
    });
    track.addEventListener('pointermove', e => {
      if (!st.scrubbing) return;
      st.hist.push({ x: e.clientX, t: performance.now() });
      if (st.hist.length > 6) st.hist.shift();
      seekFromEvent(st, e); // continuous 1:1 feedback during the drag
    });
    const end = () => { st.scrubbing = false; track.classList.remove('scrubbing'); };
    track.addEventListener('pointerup', end);
    track.addEventListener('pointercancel', end);
    track.addEventListener('keydown', e => {
      if (!isFinite(audio.duration)) return;
      if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    });
  });
}

function seekFromEvent(st, e){
  const r = st.track.getBoundingClientRect();
  const dur = isFinite(st.audio.duration) ? st.audio.duration : 0;
  let frac = (e.clientX - r.left) / r.width; // direct manipulation from grab point
  if (frac < 0 || frac > 1) { // rubber-band past the edge instead of hard-stop
    const over = frac < 0 ? frac * r.width : (frac - 1) * r.width;
    const rb = rubberband(over, r.width);
    frac = frac < 0 ? rb / r.width : 1 + rb / r.width;
    frac = Math.max(-0.04, Math.min(1.04, frac));
  }
  const t = Math.max(0, Math.min(dur || 0, frac * (dur || 0)));
  if (dur) st.audio.currentTime = t;
  paint(st, frac);
}

function paint(st, fracOverride){
  const dur = isFinite(st.audio.duration) ? st.audio.duration : 0;
  const cur = st.audio.currentTime || 0;
  const frac = fracOverride ?? (dur ? cur / dur : 0);
  st.fill.style.transform = `scaleX(${Math.max(0, Math.min(1.04, frac))})`;
  st.knob.style.left = `${Math.max(0, Math.min(100, frac * 100))}%`;
  st.time.textContent = `${fmt(cur)} / ${fmt(dur)}`;
  st.track.setAttribute('aria-valuenow', Math.round(frac * 100));
  // highlight the live segment — anchored to the player in the same card
  const card = st.root.closest('[data-card]');
  if (card) card.querySelectorAll('.seg').forEach(el => {
    const s0 = parseFloat(el.dataset.start);
    const next = el.nextElementSibling ? parseFloat(el.nextElementSibling.dataset.start) : Infinity;
    const live = cur >= s0 && cur < next;
    el.querySelector('button').classList.toggle('live', live);
  });
}

document.addEventListener('click', async ev => {
  const play = ev.target.closest('[data-play]');
  if (play) { // grab mid-motion freely; never lock input
    const st = players.get(+play.dataset.play);
    if (!st) return;
    if (st.audio.paused) { try { await st.audio.play(); } catch(e){} }
    else st.audio.pause();
    return;
  }
  const seek = ev.target.closest('[data-seek]');
  if (seek) { // same-path origin: timestamp seeks its own card's player
    const [i, t] = seek.dataset.seek.split(':');
    const st = players.get(+i);
    if (st) { st.audio.currentTime = parseFloat(t) || 0; try { await st.audio.play(); } catch(e){} }
    return;
  }
  const cp = ev.target.closest('[data-copy]');
  if (cp) { // harmony: visual + haptic fire on the same frame
    const i = +cp.dataset.copy;
    const done = () => {
      cp.textContent = 'Copied ✓'; cp.classList.add('ok');
      try { navigator.vibrate && navigator.vibrate(10); } catch(e){}
      setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('ok'); }, 1200);
    };
    try { await navigator.clipboard.writeText(data[i].full_text || ''); done(); }
    catch(e){ cp.textContent = 'Copy failed'; setTimeout(() => cp.textContent = 'Copy', 1200); }
    return;
  }
  const tg = ev.target.closest('[data-toggle]');
  if (tg) {
    const i = tg.dataset.toggle;
    const panel = document.querySelector(`[data-segs="${i}"]`);
    const open = panel.classList.toggle('open'); // interruptible mid-flight, reverses cleanly
    tg.setAttribute('aria-expanded', open);
    tg.innerHTML = `<span class="chev">▶</span> Segments (${(data[+i].segments||[]).length})`;
  }
});
qEl.oninput = () => { lastSig = ''; renderList(); };

async function refresh(){
  try {
    const [jr, tr] = await Promise.all([fetch('/api/jobs'), fetch('/api/transcripts')]);
    jobs = await jr.json(); data = await tr.json();
    renderJobs(); renderList();
  } catch(e){}
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
